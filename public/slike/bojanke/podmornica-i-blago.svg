<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#ffffff" />

  <!-- Talasi na površini -->
  <path d="M 0 100 Q 100 80 200 100 T 400 100 T 600 100 T 800 100 L 800 0 L 0 0 Z" fill="#ffffff" stroke="#111827" stroke-width="4" />
  <path d="M 0 130 Q 120 110 240 130 T 480 130 T 720 130 T 800 130" fill="none" stroke="#111827" stroke-width="3" stroke-dasharray="10 8" />

  <!-- Morsko dno -->
  <path d="M 0 650 Q 200 620 400 660 T 800 640 L 800 800 L 0 800 Z" fill="#ffffff" stroke="#111827" stroke-width="5" />

  <!-- PODMORNICA -->
  <g transform="translate(180, 220)">
    <!-- Glavno telo podmornice -->
    <ellipse cx="250" cy="140" rx="200" ry="85" fill="#ffffff" stroke="#111827" stroke-width="5.5" />
    <!-- Komandni toranj -->
    <rect x="210" y="30" width="80" height="40" rx="10" fill="#ffffff" stroke="#111827" stroke-width="5" />
    <!-- Periskop -->
    <path d="M 235 30 L 235 -25 L 280 -25 L 280 -10" fill="none" stroke="#111827" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="280" cy="-10" r="8" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <!-- Prozori (okrugli sa šrafovima) -->
    <g transform="translate(140, 140)">
      <circle cx="0" cy="0" r="30" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
      <circle cx="0" cy="0" r="23" fill="none" stroke="#111827" stroke-width="2.5" stroke-dasharray="6 5" />
    </g>
    <g transform="translate(250, 140)">
      <circle cx="0" cy="0" r="30" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
      <circle cx="0" cy="0" r="23" fill="none" stroke="#111827" stroke-width="2.5" stroke-dasharray="6 5" />
    </g>
    <g transform="translate(360, 140)">
      <circle cx="0" cy="0" r="30" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
      <circle cx="0" cy="0" r="23" fill="none" stroke="#111827" stroke-width="2.5" stroke-dasharray="6 5" />
    </g>
    <!-- Propeler pozadi -->
    <polygon points="50,140 10,95 20,140 10,185" fill="#ffffff" stroke="#111827" stroke-width="4.5" stroke-linejoin="round" />
    <rect x="45" y="125" width="15" height="30" rx="4" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <!-- Mehurići od propelera -->
    <circle cx="-15" cy="130" r="10" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <circle cx="-35" cy="115" r="14" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <circle cx="-65" cy="95" r="18" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
  </g>

  <!-- ŠKRINJA SA BLAGOM (dole desno) -->
  <g transform="translate(480, 530)">
    <!-- Donji deo kutije -->
    <path d="M 10 50 L 190 50 L 175 145 L 25 145 Z" fill="#ffffff" stroke="#111827" stroke-width="5" stroke-linejoin="round" />
    <!-- Otvoreni poklopac (nagnut unazad) -->
    <path d="M 0 50 Q 100 -20 200 50 L 190 20 Q 100 -50 10 20 Z" fill="#ffffff" stroke="#111827" stroke-width="5" stroke-linejoin="round" />
    <!-- Okovi na kutiji -->
    <line x1="60" y1="50" x2="65" y2="145" stroke="#111827" stroke-width="4" />
    <line x1="140" y1="50" x2="135" y2="145" stroke="#111827" stroke-width="4" />
    <rect x="90" y="55" width="20" height="28" rx="4" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <circle cx="100" cy="72" r="3" fill="#111827" />
    <!-- Zlatnici i dragulji koji prelivaju -->
    <circle cx="45" cy="40" r="11" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <circle cx="70" cy="35" r="11" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <circle cx="95" cy="30" r="11" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <circle cx="125" cy="32" r="11" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <circle cx="150" cy="38" r="11" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <circle cx="60" cy="22" r="11" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <circle cx="85" cy="18" r="11" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <circle cx="110" cy="16" r="11" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <circle cx="135" cy="20" r="11" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <!-- Mala kruna u škrinji -->
    <polygon points="85,15 95,-10 105,5 115,-10 125,15" fill="#ffffff" stroke="#111827" stroke-width="3.5" stroke-linejoin="round" />
  </g>

  <!-- Morske alge -->
  <path d="M 60 720 Q 30 640 70 560 Q 110 480 80 400" fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round" />
  <path d="M 100 740 Q 130 650 90 570 Q 60 490 100 420" fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round" />
  <path d="M 140 730 Q 110 660 140 590" fill="none" stroke="#111827" stroke-width="4.5" stroke-linecap="round" />

  <!-- Morska zvezda na dnu -->
  <g transform="translate(300, 680)">
    <polygon points="40,0 52,25 78,25 57,41 65,66 40,50 15,66 23,41 2,25 28,25" fill="#ffffff" stroke="#111827" stroke-width="3.5" stroke-linejoin="round" />
    <circle cx="36" cy="28" r="2.5" fill="#111827" /><circle cx="44" cy="28" r="2.5" fill="#111827" />
  </g>

  <!-- Male ribice -->
  <g transform="translate(90, 220)">
    <path d="M 0 15 C 25 -5 50 35 75 15 L 90 30 L 90 0 L 75 15 Z" fill="#ffffff" stroke="#111827" stroke-width="3.5" stroke-linejoin="round" />
    <circle cx="20" cy="12" r="3" fill="#111827" />
  </g>
  <g transform="translate(620, 360)">
    <path d="M 75 15 C 50 -5 25 35 0 15 L -15 30 L -15 0 L 0 15 Z" fill="#ffffff" stroke="#111827" stroke-width="3.5" stroke-linejoin="round" />
    <circle cx="55" cy="12" r="3" fill="#111827" />
  </g>
</svg>
