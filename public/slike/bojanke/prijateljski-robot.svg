<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#ffffff" />

  <!-- Tlo / Pod tehnološke baze sa pločicama -->
  <line x1="0" y1="680" x2="800" y2="680" stroke="#111827" stroke-width="4.5" />
  <line x1="120" y1="680" x2="60" y2="800" stroke="#111827" stroke-width="3" stroke-dasharray="8 6" />
  <line x1="280" y1="680" x2="240" y2="800" stroke="#111827" stroke-width="3" stroke-dasharray="8 6" />
  <line x1="440" y1="680" x2="420" y2="800" stroke="#111827" stroke-width="3" stroke-dasharray="8 6" />
  <line x1="600" y1="680" x2="620" y2="800" stroke="#111827" stroke-width="3" stroke-dasharray="8 6" />
  <line x1="720" y1="680" x2="760" y2="800" stroke="#111827" stroke-width="3" stroke-dasharray="8 6" />

  <!-- Planeta i zvezde u pozadini -->
  <!-- Planeta Saturn sa prstenom -->
  <g transform="translate(120, 140)">
    <circle cx="50" cy="50" r="38" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <ellipse cx="50" cy="50" rx="70" ry="18" transform="rotate(-20 50 50)" fill="none" stroke="#111827" stroke-width="3.5" />
    <path d="M 20 50 Q 50 35 80 50" fill="none" stroke="#111827" stroke-width="2.5" />
  </g>
  <!-- Mesec -->
  <path d="M 680 90 A 40 40 0 0 0 680 160 A 30 30 0 0 1 680 90 Z" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
  <!-- Zvezdice i sateliti -->
  <polygon points="340,90 343,98 352,98 345,103 348,111 340,106 332,111 335,103 328,98 337,98" fill="#ffffff" stroke="#111827" stroke-width="2.5" />
  <polygon points="560,110 563,118 572,118 565,123 568,131 560,126 552,131 555,123 548,118 557,118" fill="#ffffff" stroke="#111827" stroke-width="2.5" />
  <polygon points="220,260 222,266 228,266 223,270 225,276 220,272 215,276 217,270 212,266 218,266" fill="#ffffff" stroke="#111827" stroke-width="2" />
  <polygon points="680,240 682,246 688,246 683,250 685,256 680,252 675,256 677,250 672,246 678,246" fill="#ffffff" stroke="#111827" stroke-width="2" />

  <!-- GLAVNI PRIJATELJSKI ROBOT (CENTAR) -->
  <g transform="translate(250, 150)">
    <!-- Antena na vrhu glave -->
    <line x1="150" y1="90" x2="150" y2="40" stroke="#111827" stroke-width="5" />
    <circle cx="150" cy="30" r="14" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <path d="M 130 25 Q 120 15 115 25 M 170 25 Q 180 15 185 25" fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round" />

    <!-- Uši - zavrtnji levo i desno -->
    <rect x="55" y="125" width="20" height="30" rx="4" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <line x1="55" y1="140" x2="75" y2="140" stroke="#111827" stroke-width="2.5" />
    <rect x="225" y="125" width="20" height="30" rx="4" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <line x1="225" y1="140" x2="245" y2="140" stroke="#111827" stroke-width="2.5" />

    <!-- Glava robota (kvadratna sa zaobljenim uglovima) -->
    <rect x="75" y="90" width="150" height="110" rx="24" fill="#ffffff" stroke="#111827" stroke-width="5" />
    <!-- Ekran na licu -->
    <rect x="90" y="105" width="120" height="80" rx="14" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <!-- Oči - dva kružna senzora sa zracićima -->
    <circle cx="120" cy="135" r="14" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <circle cx="120" cy="135" r="5" fill="#111827" />
    <circle cx="180" cy="135" r="14" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <circle cx="180" cy="135" r="5" fill="#111827" />
    <!-- Nasmejana usta sa crticama -->
    <path d="M 125 165 Q 150 180 175 165" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round" />

    <!-- Vrat - fleksibilna harmonika spojnica -->
    <rect x="130" y="200" width="40" height="20" rx="4" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <line x1="130" y1="207" x2="170" y2="207" stroke="#111827" stroke-width="2.5" />
    <line x1="130" y1="213" x2="170" y2="213" stroke="#111827" stroke-width="2.5" />

    <!-- Telo robota -->
    <rect x="60" y="220" width="180" height="180" rx="26" fill="#ffffff" stroke="#111827" stroke-width="5" />

    <!-- Ekran/Merač na grudima robota -->
    <rect x="85" y="240" width="130" height="85" rx="12" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <!-- Zupčanik u ekranu -->
    <circle cx="125" cy="282" r="18" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <circle cx="125" cy="282" r="7" fill="#ffffff" stroke="#111827" stroke-width="2.5" />
    <line x1="125" y1="260" x2="125" y2="264" stroke="#111827" stroke-width="4" />
    <line x1="125" y1="300" x2="125" y2="304" stroke="#111827" stroke-width="4" />
    <line x1="103" y1="282" x2="107" y2="282" stroke="#111827" stroke-width="4" />
    <line x1="143" y1="282" x2="147" y2="282" stroke="#111827" stroke-width="4" />
    <!-- Dugmići i slajderi desno u ekranu -->
    <circle cx="175" cy="262" r="8" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <circle cx="195" cy="262" r="8" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <rect x="165" y="280" width="40" height="8" rx="4" fill="#ffffff" stroke="#111827" stroke-width="2.5" />
    <circle cx="185" cy="284" r="5" fill="#111827" />
    <path d="M 95 310 L 115 310 L 125 300 L 140 315 L 155 305 L 175 310 L 205 310" fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round" />

    <!-- Tri velika dugmeta na dnu stomaka -->
    <circle cx="105" cy="360" r="12" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <circle cx="150" cy="360" r="12" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <circle cx="195" cy="360" r="12" fill="#ffffff" stroke="#111827" stroke-width="3.5" />

    <!-- Leva ruka - maše uvis -->
    <g>
      <circle cx="60" cy="250" r="14" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
      <path d="M 50 250 Q -10 230 -20 180" fill="none" stroke="#111827" stroke-width="12" stroke-linecap="round" />
      <!-- Hvataljka klešta -->
      <path d="M -30 180 C -50 160 -40 140 -20 150 M -15 180 C -5 160 5 140 -15 150" fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round" />
    </g>

    <!-- Desna ruka - spuštena sa kleštima -->
    <g>
      <circle cx="240" cy="250" r="14" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
      <path d="M 250 250 Q 300 280 290 350" fill="none" stroke="#111827" stroke-width="12" stroke-linecap="round" />
      <!-- Hvataljka klešta -->
      <path d="M 280 350 C 270 380 290 390 300 375 M 295 350 C 315 380 325 365 310 355" fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round" />
    </g>

    <!-- Noge robota -->
    <!-- Leva noga -->
    <rect x="90" y="400" width="35" height="100" rx="10" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
    <line x1="90" y1="430" x2="125" y2="430" stroke="#111827" stroke-width="3" />
    <line x1="90" y1="460" x2="125" y2="460" stroke="#111827" stroke-width="3" />
    <!-- Levo stopalo -->
    <path d="M 70 530 L 140 530 Q 140 500 115 500 L 80 500 Z" fill="#ffffff" stroke="#111827" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Desna noga -->
    <rect x="175" y="400" width="35" height="100" rx="10" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
    <line x1="175" y1="430" x2="210" y2="430" stroke="#111827" stroke-width="3" />
    <line x1="175" y1="460" x2="210" y2="460" stroke="#111827" stroke-width="3" />
    <!-- Desno stopalo -->
    <path d="M 160 530 L 230 530 Q 230 500 205 500 L 170 500 Z" fill="#ffffff" stroke="#111827" stroke-width="4.5" stroke-linejoin="round" />
  </g>

  <!-- MALI LETEĆI ROBOT-DRON POMAGAČ (DESNO GORE) -->
  <g transform="translate(600, 320)">
    <!-- Propeler gore -->
    <line x1="60" y1="20" x2="60" y2="35" stroke="#111827" stroke-width="3" />
    <ellipse cx="60" cy="20" rx="35" ry="6" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <!-- Okruglo telo drona -->
    <circle cx="60" cy="70" r="35" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <!-- Veliko jedno oko poput miniona/kamere -->
    <circle cx="60" cy="65" r="16" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <circle cx="60" cy="65" r="6" fill="#111827" />
    <!-- Nasmejana usta -->
    <path d="M 50 88 Q 60 96 70 88" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" />
    <!-- Mala krilca sa strane -->
    <polygon points="25,65 5,55 10,75" fill="#ffffff" stroke="#111827" stroke-width="3" stroke-linejoin="round" />
    <polygon points="95,65 115,55 110,75" fill="#ffffff" stroke="#111827" stroke-width="3" stroke-linejoin="round" />
    <!-- Trag letenja / mlaz vazduha -->
    <path d="M 50 110 L 45 130 M 60 110 L 60 135 M 70 110 L 75 130" stroke="#111827" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>