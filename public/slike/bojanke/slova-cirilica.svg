<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#ffffff" />
  
  <!-- Velika šuplja ćirilična slova А, Б, В -->
  <!-- Slovo А -->
  <g transform="translate(180, 260)">
    <path d="M 0 160 L 60 -60 L 120 160 L 80 160 L 65 105 L 35 105 L 20 160 Z M 44 75 L 76 75 L 60 20 Z" fill="#ffffff" stroke="#111827" stroke-width="5" stroke-linejoin="round" />
  </g>
  <!-- Slovo Б -->
  <g transform="translate(360, 260)">
    <path d="M 0 -60 L 80 -60 L 80 -30 L 35 -30 L 35 20 C 50 15 65 15 75 25 C 105 50 105 130 75 150 C 60 160 40 160 0 160 Z M 35 45 L 50 45 C 65 45 65 130 50 130 L 35 130 Z" fill="#ffffff" stroke="#111827" stroke-width="5" stroke-linejoin="round" />
  </g>
  <!-- Slovo В -->
  <g transform="translate(540, 260)">
    <path d="M 0 -60 L 65 -60 C 105 -60 105 15 65 20 C 110 25 110 160 65 160 L 0 160 Z M 35 -25 L 55 -25 C 75 -25 75 -5 55 -5 L 35 -5 Z M 35 35 L 60 35 C 80 35 80 125 60 125 L 35 125 Z" fill="#ffffff" stroke="#111827" stroke-width="5" stroke-linejoin="round" />
  </g>

  <!-- Crtež uz azbuku: Bubamara -->
  <g transform="translate(160, 560)">
    <circle cx="60" cy="50" r="50" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
    <path d="M 60 0 L 60 100" stroke="#111827" stroke-width="4" />
    <circle cx="40" cy="30" r="9" fill="#111827" />
    <circle cx="35" cy="70" r="9" fill="#111827" />
    <circle cx="80" cy="30" r="9" fill="#111827" />
    <circle cx="85" cy="70" r="9" fill="#111827" />
    <circle cx="60" cy="-5" r="24" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <line x1="50" y1="-25" x2="40" y2="-45" stroke="#111827" stroke-width="3" />
    <line x1="70" y1="-25" x2="80" y2="-45" stroke="#111827" stroke-width="3" />
    <text x="60" y="140" text-anchor="middle" font-size="28" font-weight="800" font-family="system-ui" fill="#111827">Б – Бубамара</text>
  </g>

  <!-- Crayon / drvena bojica -->
  <g transform="translate(480, 520) rotate(-25)">
    <polygon points="0,0 200,0 220,15 200,30 0,30" fill="#ffffff" stroke="#111827" stroke-width="4" stroke-linejoin="round" />
    <polygon points="200,0 220,15 200,30" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <polygon points="213,10 220,15 213,20" fill="#111827" />
  </g>
</svg>
