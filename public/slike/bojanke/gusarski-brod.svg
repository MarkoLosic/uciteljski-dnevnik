<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#ffffff" />

  <!-- Sunce i oblaci na morskom horizontu -->
  <circle cx="710" cy="120" r="50" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
  <g stroke="#111827" stroke-width="3.5" stroke-linecap="round">
    <line x1="710" y1="55" x2="710" y2="35" />
    <line x1="775" y1="120" x2="795" y2="120" />
    <line x1="710" y1="185" x2="710" y2="205" />
    <line x1="645" y1="120" x2="625" y2="120" />
    <line x1="755" y1="75" x2="770" y2="60" />
    <line x1="755" y1="165" x2="770" y2="180" />
  </g>
  <!-- Galebovi u letu -->
  <path d="M 120 100 Q 135 85 150 100 Q 165 85 180 100" fill="none" stroke="#111827" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 230 130 Q 242 118 255 130 Q 268 118 280 130" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" />

  <!-- Morska linija i talasi u pozadini -->
  <line x1="0" y1="460" x2="800" y2="460" stroke="#111827" stroke-width="3.5" stroke-dasharray="12 8" />

  <!-- VELIKI GUSARSKI JEDRENJAK (CENTAR-LEVO) -->
  <g transform="translate(100, 160)">
    <!-- Trup broda sa topovskim otvorima i drvenim daskama -->
    <path d="M 40 280 Q 20 330 70 380 Q 200 420 340 380 Q 370 340 380 260 L 330 260 L 320 280 L 100 280 L 80 260 Z" fill="#ffffff" stroke="#111827" stroke-width="5" stroke-linejoin="round" />
    <line x1="70" y1="310" x2="350" y2="310" stroke="#111827" stroke-width="3" />
    <line x1="80" y1="340" x2="330" y2="340" stroke="#111827" stroke-width="3" />
    <!-- Topovski prozori / otvori -->
    <circle cx="120" cy="325" r="10" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <circle cx="120" cy="325" r="4" fill="#111827" />
    <circle cx="190" cy="325" r="10" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <circle cx="190" cy="325" r="4" fill="#111827" />
    <circle cx="260" cy="325" r="10" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <circle cx="260" cy="325" r="4" fill="#111827" />

    <!-- Krma (zadnji uzdignuti deo broda sa kabinom i fenjerom) -->
    <polygon points="320,280 370,250 365,210 300,210 300,280" fill="#ffffff" stroke="#111827" stroke-width="4" stroke-linejoin="round" />
    <!-- Prozor kabine -->
    <rect x="315" y="225" width="26" height="30" rx="6" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <line x1="328" y1="225" x2="328" y2="255" stroke="#111827" stroke-width="2" />
    <line x1="315" y1="240" x2="341" y2="240" stroke="#111827" stroke-width="2" />
    <!-- Gusarski fenjer na krmi -->
    <polygon points="380,220 375,235 385,235" fill="#ffffff" stroke="#111827" stroke-width="2.5" />

    <!-- Pramac (prednji kljun broda sa šiljkom) -->
    <path d="M 40 280 L -15 250 L 5 285 Z" fill="#ffffff" stroke="#111827" stroke-width="4" stroke-linejoin="round" />

    <!-- PREDNJI JARBOL I JEDRO -->
    <line x1="140" y1="280" x2="140" y2="60" stroke="#111827" stroke-width="6" />
    <!-- Donje jedro -->
    <path d="M 100 170 Q 140 190 180 170 L 175 250 Q 140 270 95 250 Z" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <!-- Gornje manje jedro -->
    <path d="M 110 80 Q 140 95 170 80 L 165 145 Q 140 160 105 145 Z" fill="#ffffff" stroke="#111827" stroke-width="3.5" />

    <!-- GLAVNI SREDNJI JARBOL (VIŠI) SA KORPOM ZA OSMATRAČA -->
    <line x1="230" y1="280" x2="230" y2="20" stroke="#111827" stroke-width="7" />
    <!-- Korpa za osmatrača na vrhu -->
    <polygon points="215,65 245,65 240,85 220,85" fill="#ffffff" stroke="#111827" stroke-width="3.5" stroke-linejoin="round" />
    <!-- Gusarska zastava sa lobanjom i kostima ili gusarskim amblemom -->
    <polygon points="230,20 295,38 230,55" fill="#ffffff" stroke="#111827" stroke-width="3.5" stroke-linejoin="round" />
    <!-- Zvezda / amblem na zastavi -->
    <circle cx="250" cy="38" r="6" fill="#111827" />

    <!-- Glavno veliko jedro -->
    <path d="M 190 150 Q 235 180 280 150 L 275 250 Q 235 280 185 250 Z" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
    <path d="M 195 90 Q 235 110 275 90 L 270 140 Q 235 160 190 140 Z" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <!-- Konopci i užad jedrenjaka -->
    <line x1="140" y1="70" x2="20" y2="280" stroke="#111827" stroke-width="2.5" />
    <line x1="230" y1="40" x2="140" y2="70" stroke="#111827" stroke-width="2.5" />
    <line x1="230" y1="40" x2="350" y2="260" stroke="#111827" stroke-width="2.5" />
  </g>

  <!-- Peneći morski talasi oko broda -->
  <path d="M 0 550 Q 60 520 120 550 Q 180 520 240 550 Q 300 520 360 550 Q 420 520 480 550" fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round" />
  <path d="M 40 590 Q 100 560 160 590 Q 220 560 280 590 Q 340 560 400 590" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round" />

  <!-- PEŠČANO OSTRVO SA BLAGOM (DESNO) -->
  <g transform="translate(450, 480)">
    <!-- Peščana obala / breg ostrva -->
    <path d="M 0 160 Q 120 80 240 90 Q 340 100 350 220 L 0 220 Z" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
    
    <!-- PALMA NA OSTRVU -->
    <!-- Zakrivljeno stablo palme sa prstenovima -->
    <path d="M 170 120 Q 210 20 160 -80 L 185 -85 Q 240 20 195 120 Z" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
    <!-- Krošnja palme - 5 velikih listova -->
    <g transform="translate(170, -85)">
      <path d="M 0 0 Q -70 -60 -120 -20 Q -80 0 0 0" fill="#ffffff" stroke="#111827" stroke-width="4" />
      <path d="M 0 0 Q -20 -90 40 -100 Q 30 -50 0 0" fill="#ffffff" stroke="#111827" stroke-width="4" />
      <path d="M 0 0 Q 70 -80 120 -50 Q 80 -10 0 0" fill="#ffffff" stroke="#111827" stroke-width="4" />
      <path d="M 0 0 Q 90 0 120 50 Q 60 40 0 0" fill="#ffffff" stroke="#111827" stroke-width="4" />
      <path d="M 0 0 Q -50 30 -80 80 Q -60 20 0 0" fill="#ffffff" stroke="#111827" stroke-width="4" />
      <!-- Kokosovi orasi -->
      <circle cx="-5" cy="15" r="9" fill="#ffffff" stroke="#111827" stroke-width="3" />
      <circle cx="10" cy="15" r="9" fill="#ffffff" stroke="#111827" stroke-width="3" />
    </g>

    <!-- OTVORENA ŠKRINJA SA GUSARSKIM BLAGOM -->
    <g transform="translate(60, 110)">
      <!-- Donji sanduk škrinje -->
      <rect x="20" y="50" width="90" height="55" rx="6" fill="#ffffff" stroke="#111827" stroke-width="4" />
      <!-- Metalne trake na sanduku -->
      <line x1="40" y1="50" x2="40" y2="105" stroke="#111827" stroke-width="3" />
      <line x1="90" y1="50" x2="90" y2="105" stroke="#111827" stroke-width="3" />
      <circle cx="65" cy="65" r="6" fill="#111827" />
      <!-- Otvoreni poklopac škrinje -->
      <path d="M 15 50 Q 65 15 115 50 L 110 30 Q 65 -5 20 30 Z" fill="#ffffff" stroke="#111827" stroke-width="4" stroke-linejoin="round" />
      <!-- Zlatnici i dragulji koji svetle iz škrinje -->
      <circle cx="45" cy="45" r="7" fill="#ffffff" stroke="#111827" stroke-width="2.5" />
      <circle cx="60" cy="40" r="8" fill="#ffffff" stroke="#111827" stroke-width="2.5" />
      <circle cx="75" cy="42" r="7" fill="#ffffff" stroke="#111827" stroke-width="2.5" />
      <circle cx="88" cy="46" r="6" fill="#ffffff" stroke="#111827" stroke-width="2.5" />
      <polygon points="65,22 68,28 75,28 70,32 72,39 65,35 58,39 60,32 55,28 62,28" fill="#ffffff" stroke="#111827" stroke-width="2" />
    </g>
  </g>
</svg>