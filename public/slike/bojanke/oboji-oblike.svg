<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#ffffff" />
  
  <!-- OBLICI ZA BOJENJE ZA NAJMLAĐE -->
  <!-- Krug -->
  <g transform="translate(240, 240)">
    <circle cx="0" cy="0" r="90" fill="#ffffff" stroke="#111827" stroke-width="5" />
    <circle cx="-30" cy="-20" r="10" fill="#111827" /><circle cx="30" cy="-20" r="10" fill="#111827" />
    <path d="M -30 25 Q 0 55 30 25" fill="none" stroke="#111827" stroke-width="4.5" stroke-linecap="round" />
    <text x="0" y="130" text-anchor="middle" font-size="26" font-weight="800" font-family="system-ui" fill="#111827">KRUG</text>
  </g>

  <!-- Kvadrat -->
  <g transform="translate(560, 240)">
    <rect x="-85" y="-85" width="170" height="170" rx="16" fill="#ffffff" stroke="#111827" stroke-width="5" />
    <circle cx="-30" cy="-20" r="10" fill="#111827" /><circle cx="30" cy="-20" r="10" fill="#111827" />
    <path d="M -30 25 Q 0 55 30 25" fill="none" stroke="#111827" stroke-width="4.5" stroke-linecap="round" />
    <text x="0" y="130" text-anchor="middle" font-size="26" font-weight="800" font-family="system-ui" fill="#111827">KVADRAT</text>
  </g>

  <!-- Trougao -->
  <g transform="translate(240, 560)">
    <polygon points="0,-95 95,75 -95,75" fill="#ffffff" stroke="#111827" stroke-width="5" stroke-linejoin="round" />
    <circle cx="-25" cy="10" r="10" fill="#111827" /><circle cx="25" cy="10" r="10" fill="#111827" />
    <path d="M -20 45 Q 0 65 20 45" fill="none" stroke="#111827" stroke-width="4.5" stroke-linecap="round" />
    <text x="0" y="125" text-anchor="middle" font-size="26" font-weight="800" font-family="system-ui" fill="#111827">TROUGAO</text>
  </g>

  <!-- Zvezda -->
  <g transform="translate(560, 560)">
    <polygon points="0,-95 28,-30 95,-30 40,12 60,78 0,38 -60,78 -40,12 -95,-30 -28,-30" fill="#ffffff" stroke="#111827" stroke-width="5" stroke-linejoin="round" />
    <circle cx="-16" cy="-2" r="8" fill="#111827" /><circle cx="16" cy="-2" r="8" fill="#111827" />
    <path d="M -15 20 Q 0 35 15 20" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round" />
    <text x="0" y="125" text-anchor="middle" font-size="26" font-weight="800" font-family="system-ui" fill="#111827">ZVEZDA</text>
  </g>
</svg>
