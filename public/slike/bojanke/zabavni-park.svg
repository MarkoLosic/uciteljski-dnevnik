<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#ffffff" />

  <!-- Zastavice na nebu na vrhu zabavnog parka -->
  <path d="M 0 60 Q 200 120 400 70 Q 600 120 800 60" fill="none" stroke="#111827" stroke-width="3.5" />
  <polygon points="60,78 95,84 78,125" fill="#ffffff" stroke="#111827" stroke-width="3" />
  <polygon points="140,93 175,98 158,140" fill="#ffffff" stroke="#111827" stroke-width="3" />
  <polygon points="220,97 255,95 238,140" fill="#ffffff" stroke="#111827" stroke-width="3" />
  <polygon points="300,88 335,82 318,125" fill="#ffffff" stroke="#111827" stroke-width="3" />
  <polygon points="460,82 495,88 478,125" fill="#ffffff" stroke="#111827" stroke-width="3" />
  <polygon points="540,95 575,97 558,140" fill="#ffffff" stroke="#111827" stroke-width="3" />
  <polygon points="620,98 655,93 638,140" fill="#ffffff" stroke="#111827" stroke-width="3" />
  <polygon points="700,84 735,78 718,125" fill="#ffffff" stroke="#111827" stroke-width="3" />

  <!-- Pufnasti oblaci i sunce -->
  <circle cx="400" cy="110" r="45" fill="#ffffff" stroke="#111827" stroke-width="4" />
  <g stroke="#111827" stroke-width="3" stroke-linecap="round">
    <line x1="400" y1="50" x2="400" y2="35" />
    <line x1="400" y1="170" x2="400" y2="185" />
    <line x1="340" y1="110" x2="325" y2="110" />
    <line x1="460" y1="110" x2="475" y2="110" />
  </g>

  <!-- Tlo zabavnog parka -->
  <line x1="0" y1="690" x2="800" y2="690" stroke="#111827" stroke-width="4.5" />

  <!-- VELIKI PANORAMSKI TOČAK (FERRIS WHEEL - LEVO) -->
  <g transform="translate(190, 420)">
    <!-- Oslonac / Tronožac točka -->
    <line x1="0" y1="0" x2="-80" y2="270" stroke="#111827" stroke-width="7" stroke-linecap="round" />
    <line x1="0" y1="0" x2="80" y2="270" stroke="#111827" stroke-width="7" stroke-linecap="round" />
    <line x1="-50" y1="170" x2="50" y2="170" stroke="#111827" stroke-width="4.5" />

    <!-- Spoljašnji i unutrašnji krug točka -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#111827" stroke-width="5" />
    <circle cx="0" cy="0" r="130" fill="none" stroke="#111827" stroke-width="3.5" />
    <circle cx="0" cy="0" r="28" fill="#ffffff" stroke="#111827" stroke-width="5" />

    <!-- Paoci točka (8 paoka) -->
    <line x1="0" y1="-180" x2="0" y2="180" stroke="#111827" stroke-width="3.5" />
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#111827" stroke-width="3.5" />
    <line x1="-127" y1="-127" x2="127" y2="127" stroke="#111827" stroke-width="3.5" />
    <line x1="-127" y1="127" x2="127" y2="-127" stroke="#111827" stroke-width="3.5" />

    <!-- Kabine (korpe) za posetioce na točku -->
    <!-- Gornja kabina -->
    <g transform="translate(0, -180)">
      <line x1="0" y1="0" x2="0" y2="15" stroke="#111827" stroke-width="3" />
      <rect x="-18" y="15" width="36" height="30" rx="8" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
      <rect x="-12" y="20" width="24" height="12" rx="3" fill="#ffffff" stroke="#111827" stroke-width="2.5" />
    </g>
    <!-- Donja kabina -->
    <g transform="translate(0, 180)">
      <line x1="0" y1="0" x2="0" y2="15" stroke="#111827" stroke-width="3" />
      <rect x="-18" y="15" width="36" height="30" rx="8" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
      <rect x="-12" y="20" width="24" height="12" rx="3" fill="#ffffff" stroke="#111827" stroke-width="2.5" />
    </g>
    <!-- Leva kabina -->
    <g transform="translate(-180, 0)">
      <line x1="0" y1="0" x2="0" y2="15" stroke="#111827" stroke-width="3" />
      <rect x="-18" y="15" width="36" height="30" rx="8" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
      <rect x="-12" y="20" width="24" height="12" rx="3" fill="#ffffff" stroke="#111827" stroke-width="2.5" />
    </g>
    <!-- Desna kabina -->
    <g transform="translate(180, 0)">
      <line x1="0" y1="0" x2="0" y2="15" stroke="#111827" stroke-width="3" />
      <rect x="-18" y="15" width="36" height="30" rx="8" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
      <rect x="-12" y="20" width="24" height="12" rx="3" fill="#ffffff" stroke="#111827" stroke-width="2.5" />
    </g>
    <!-- Dijagonalne 4 kabine -->
    <g transform="translate(-127, -127)">
      <line x1="0" y1="0" x2="0" y2="15" stroke="#111827" stroke-width="3" />
      <rect x="-18" y="15" width="36" height="30" rx="8" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    </g>
    <g transform="translate(127, -127)">
      <line x1="0" y1="0" x2="0" y2="15" stroke="#111827" stroke-width="3" />
      <rect x="-18" y="15" width="36" height="30" rx="8" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    </g>
    <g transform="translate(-127, 127)">
      <line x1="0" y1="0" x2="0" y2="15" stroke="#111827" stroke-width="3" />
      <rect x="-18" y="15" width="36" height="30" rx="8" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    </g>
    <g transform="translate(127, 127)">
      <line x1="0" y1="0" x2="0" y2="15" stroke="#111827" stroke-width="3" />
      <rect x="-18" y="15" width="36" height="30" rx="8" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    </g>
  </g>

  <!-- VRTEŠKA / RINGIŠPIL SA KONJIĆIMA (DESNO) -->
  <g transform="translate(560, 420)">
    <!-- Krov vrteške sa prugama -->
    <polygon points="110,0 -10,90 230,90" fill="#ffffff" stroke="#111827" stroke-width="4.5" stroke-linejoin="round" />
    <line x1="110" y1="0" x2="50" y2="90" stroke="#111827" stroke-width="3" />
    <line x1="110" y1="0" x2="110" y2="90" stroke="#111827" stroke-width="3" />
    <line x1="110" y1="0" x2="170" y2="90" stroke="#111827" stroke-width="3" />
    <!-- Zastavica na vrhu vrteške -->
    <line x1="110" y1="0" x2="110" y2="-25" stroke="#111827" stroke-width="3.5" />
    <polygon points="110,-25 145,-15 110,-5" fill="#ffffff" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Oslonci / stubovi vrteške -->
    <line x1="110" y1="90" x2="110" y2="270" stroke="#111827" stroke-width="7" />
    <line x1="25" y1="90" x2="25" y2="270" stroke="#111827" stroke-width="4.5" />
    <line x1="195" y1="90" x2="195" y2="270" stroke="#111827" stroke-width="4.5" />

    <!-- Postolje vrteške -->
    <rect x="-15" y="255" width="250" height="20" rx="6" fill="#ffffff" stroke="#111827" stroke-width="4" />

    <!-- KONJIĆ NA VRTEŠCI 1 (LEVI) -->
    <g transform="translate(25, 140)">
      <!-- Telo konjića -->
      <ellipse cx="25" cy="40" rx="30" ry="18" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
      <!-- Glava i vrat -->
      <path d="M 40 35 L 55 10 Q 58 5 62 10 L 65 25 Q 55 35 45 45 Z" fill="#ffffff" stroke="#111827" stroke-width="3.5" stroke-linejoin="round" />
      <circle cx="58" cy="15" r="2.5" fill="#111827" />
      <!-- Noge -->
      <line x1="10" y1="52" x2="0" y2="75" stroke="#111827" stroke-width="3.5" stroke-linecap="round" />
      <line x1="40" y1="52" x2="50" y2="75" stroke="#111827" stroke-width="3.5" stroke-linecap="round" />
      <!-- Sedlo -->
      <path d="M 20 28 Q 28 35 36 28" fill="none" stroke="#111827" stroke-width="3" />
      <!-- Rep -->
      <path d="M 0 35 Q -15 45 -5 55" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- KONJIĆ NA VRTEŠCI 2 (DESNI) -->
    <g transform="translate(145, 150)">
      <ellipse cx="25" cy="40" rx="30" ry="18" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
      <path d="M 40 35 L 55 10 Q 58 5 62 10 L 65 25 Q 55 35 45 45 Z" fill="#ffffff" stroke="#111827" stroke-width="3.5" stroke-linejoin="round" />
      <circle cx="58" cy="15" r="2.5" fill="#111827" />
      <line x1="10" y1="52" x2="0" y2="75" stroke="#111827" stroke-width="3.5" stroke-linecap="round" />
      <line x1="40" y1="52" x2="50" y2="75" stroke="#111827" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 20 28 Q 28 35 36 28" fill="none" stroke="#111827" stroke-width="3" />
      <path d="M 0 35 Q -15 45 -5 55" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- KIOSK / KOLICA SA BALONIMA I ŠEĆERNOM VUNOM (CENTAR DOLE) -->
  <g transform="translate(360, 560)">
    <!-- Tenda kolica sa prugama -->
    <path d="M 10 30 Q 55 10 100 30 L 95 45 Q 55 25 15 45 Z" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <!-- Telo kolica -->
    <rect x="20" y="60" width="70" height="50" rx="6" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <!-- Točak kolica -->
    <circle cx="35" cy="115" r="15" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <circle cx="35" cy="115" r="4" fill="#111827" />
    <!-- Noga oslonac desno -->
    <line x1="75" y1="110" x2="75" y2="130" stroke="#111827" stroke-width="3.5" />
    <!-- Šećerna vuna na štapiću -->
    <ellipse cx="45" cy="40" rx="14" ry="18" fill="#ffffff" stroke="#111827" stroke-width="2.5" stroke-dasharray="4 3" />
    <line x1="45" y1="50" x2="45" y2="70" stroke="#111827" stroke-width="2" />
    <!-- Baloni koji lete iznad kolica -->
    <ellipse cx="70" cy="-20" rx="14" ry="18" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <ellipse cx="90" cy="-10" rx="14" ry="18" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <line x1="70" y1="-2" x2="75" y2="60" stroke="#111827" stroke-width="1.8" />
    <line x1="90" y1="8" x2="75" y2="60" stroke="#111827" stroke-width="1.8" />
  </g>
</svg>