<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#ffffff" />
  
  <!-- Velika šuplja slova A, B, C za bojenje -->
  <!-- Slovo A -->
  <g transform="translate(180, 260)">
    <path d="M 0 160 L 60 -60 L 120 160 L 80 160 L 65 105 L 35 105 L 20 160 Z M 44 75 L 76 75 L 60 20 Z" fill="#ffffff" stroke="#111827" stroke-width="5" stroke-linejoin="round" />
  </g>
  <!-- Slovo B -->
  <g transform="translate(360, 260)">
    <path d="M 0 -60 L 65 -60 C 105 -60 105 15 65 20 C 110 25 110 160 65 160 L 0 160 Z M 35 -25 L 55 -25 C 75 -25 75 -5 55 -5 L 35 -5 Z M 35 35 L 60 35 C 80 35 80 125 60 125 L 35 125 Z" fill="#ffffff" stroke="#111827" stroke-width="5" stroke-linejoin="round" />
  </g>
  <!-- Slovo C -->
  <g transform="translate(540, 260)">
    <path d="M 100 -20 C 80 -60 20 -60 -10 -15 C -45 35 -45 95 -10 135 C 20 170 80 170 100 130 L 70 110 C 55 130 15 130 -5 105 C -25 75 -25 45 -5 15 C 15 -10 55 -10 70 10 Z" fill="#ffffff" stroke="#111827" stroke-width="5" stroke-linejoin="round" />
  </g>

  <!-- Crtež uz slovo A: Jabuka -->
  <g transform="translate(160, 560)">
    <ellipse cx="60" cy="50" rx="55" ry="48" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
    <path d="M 60 8 Q 70 -20 85 -30" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round" />
    <ellipse cx="90" cy="-20" rx="14" ry="7" transform="rotate(-30 90 -20)" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <text x="60" y="140" text-anchor="middle" font-size="28" font-weight="800" font-family="system-ui" fill="#111827">A – Avion / Jabuka</text>
  </g>

  <!-- Bojice i olovke na dnu -->
  <g transform="translate(480, 520) rotate(-25)">
    <polygon points="0,0 200,0 220,15 200,30 0,30" fill="#ffffff" stroke="#111827" stroke-width="4" stroke-linejoin="round" />
    <polygon points="200,0 220,15 200,30" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <polygon points="213,10 220,15 213,20" fill="#111827" />
  </g>
</svg>
