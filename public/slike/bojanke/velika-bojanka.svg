<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#ffffff" />
  
  <!-- Sunce i zraci -->
  <circle cx="140" cy="140" r="60" fill="#ffffff" stroke="#111827" stroke-width="5" />
  <circle cx="120" cy="130" r="6" fill="#111827" /><circle cx="160" cy="130" r="6" fill="#111827" />
  <path d="M 125 155 Q 140 170 155 155" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round" />
  <line x1="140" y1="50" x2="140" y2="20" stroke="#111827" stroke-width="4.5" stroke-linecap="round" />
  <line x1="50" y1="140" x2="20" y2="140" stroke="#111827" stroke-width="4.5" stroke-linecap="round" />
  <line x1="75" y1="75" x2="55" y2="55" stroke="#111827" stroke-width="4.5" stroke-linecap="round" />

  <!-- Duga na nebu -->
  <path d="M 280 340 A 240 240 0 0 1 760 340" fill="none" stroke="#111827" stroke-width="6" />
  <path d="M 310 340 A 210 210 0 0 1 730 340" fill="none" stroke="#111827" stroke-width="5" />
  <path d="M 340 340 A 180 180 0 0 1 700 340" fill="none" stroke="#111827" stroke-width="5" />

  <!-- Oblak na kraju duge -->
  <g transform="translate(260, 320)">
    <path d="M 0 0 C -25 -25 -10 -70 25 -60 C 50 -85 95 -75 105 -45 C 135 -55 155 -25 140 10 C 130 35 15 35 0 0 Z" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
  </g>

  <!-- Brežuljci i cvetna livada -->
  <path d="M 0 540 Q 250 480 500 530 T 800 500 L 800 800 L 0 800 Z" fill="#ffffff" stroke="#111827" stroke-width="5" />

  <!-- Kućica pečurka u centru -->
  <g transform="translate(420, 440)">
    <!-- Klobuk pečurke -->
    <path d="M -90 60 C -110 -20, 110 -20, 90 60 Z" fill="#ffffff" stroke="#111827" stroke-width="5" stroke-linejoin="round" />
    <circle cx="-40" cy="18" r="14" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <circle cx="20" cy="8" r="16" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <circle cx="55" cy="35" r="12" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <!-- Drška pečurke -->
    <path d="M -50 60 L -60 180 L 60 180 L 50 60 Z" fill="#ffffff" stroke="#111827" stroke-width="5" />
    <!-- Vrata -->
    <path d="M -20 180 L -20 120 C -20 100 20 100 20 120 L 20 180 Z" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <circle cx="12" cy="148" r="3.5" fill="#111827" />
    <!-- Okrugli prozor -->
    <circle cx="0" cy="85" r="14" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <line x1="-14" y1="85" x2="14" y2="85" stroke="#111827" stroke-width="2.5" />
    <line x1="0" y1="71" x2="0" y2="99" stroke="#111827" stroke-width="2.5" />
  </g>

  <!-- Cvetići na livadi -->
  <g transform="translate(180, 620)">
    <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <circle cx="-20" cy="0" r="11" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <circle cx="20" cy="0" r="11" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <circle cx="0" cy="-20" r="11" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <circle cx="0" cy="20" r="11" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <line x1="0" y1="20" x2="0" y2="80" stroke="#111827" stroke-width="4" />
    <ellipse cx="14" cy="50" rx="14" ry="7" transform="rotate(30 14 50)" fill="#ffffff" stroke="#111827" stroke-width="3" />
  </g>
  <g transform="translate(680, 640)">
    <circle cx="0" cy="0" r="12" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <circle cx="-16" cy="0" r="9" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <circle cx="16" cy="0" r="9" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <circle cx="0" cy="-16" r="9" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <circle cx="0" cy="16" r="9" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <line x1="0" y1="16" x2="0" y2="70" stroke="#111827" stroke-width="4" />
  </g>
</svg>
