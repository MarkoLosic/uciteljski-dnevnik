<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#ffffff" />

  <!-- GITARA (u centru nagnuta) -->
  <g transform="translate(250, 420) rotate(-35)">
    <!-- Telo gitare (kruškoliko) -->
    <path d="M -80 80 C -140 160, -140 240, -70 300 C 0 350, 90 340, 130 270 C 160 220, 130 170, 80 130 C 100 80, 80 20, 20 -10 C -40 -30, -70 20, -80 80 Z" fill="#ffffff" stroke="#111827" stroke-width="5" stroke-linejoin="round" />
    <!-- Otvor za zvuk -->
    <circle cx="20" cy="150" r="42" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
    <circle cx="20" cy="150" r="34" fill="none" stroke="#111827" stroke-width="2.5" stroke-dasharray="6 5" />
    <!-- Mostić na telu -->
    <rect x="-10" y="240" width="60" height="15" rx="4" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <!-- Vrat gitare -->
    <rect x="5" y="-220" width="30" height="210" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
    <!-- Pragovi -->
    <line x1="5" y1="-180" x2="35" y2="-180" stroke="#111827" stroke-width="3" />
    <line x1="5" y1="-140" x2="35" y2="-140" stroke="#111827" stroke-width="3" />
    <line x1="5" y1="-100" x2="35" y2="-100" stroke="#111827" stroke-width="3" />
    <line x1="5" y1="-60" x2="35" y2="-60" stroke="#111827" stroke-width="3" />
    <line x1="5" y1="-20" x2="35" y2="-20" stroke="#111827" stroke-width="3" />
    <!-- Glava gitare -->
    <polygon points="-2,-270 42,-270 35,-220 5,-220" fill="#ffffff" stroke="#111827" stroke-width="4.5" stroke-linejoin="round" />
    <!-- Čivije -->
    <circle cx="-10" cy="-255" r="7" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <circle cx="-10" cy="-235" r="7" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <circle cx="50" cy="-255" r="7" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <circle cx="50" cy="-235" r="7" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
  </g>

  <!-- KLAVIR / DIRKE (dole) -->
  <g transform="translate(100, 640)">
    <rect x="0" y="0" width="600" height="110" rx="12" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
    <!-- Bele dirke -->
    <line x1="40" y1="0" x2="40" y2="110" stroke="#111827" stroke-width="3" />
    <line x1="80" y1="0" x2="80" y2="110" stroke="#111827" stroke-width="3" />
    <line x1="120" y1="0" x2="120" y2="110" stroke="#111827" stroke-width="3" />
    <line x1="160" y1="0" x2="160" y2="110" stroke="#111827" stroke-width="3" />
    <line x1="200" y1="0" x2="200" y2="110" stroke="#111827" stroke-width="3" />
    <line x1="240" y1="0" x2="240" y2="110" stroke="#111827" stroke-width="3" />
    <line x1="280" y1="0" x2="280" y2="110" stroke="#111827" stroke-width="3" />
    <line x1="320" y1="0" x2="320" y2="110" stroke="#111827" stroke-width="3" />
    <line x1="360" y1="0" x2="360" y2="110" stroke="#111827" stroke-width="3" />
    <line x1="400" y1="0" x2="400" y2="110" stroke="#111827" stroke-width="3" />
    <line x1="440" y1="0" x2="440" y2="110" stroke="#111827" stroke-width="3" />
    <line x1="480" y1="0" x2="480" y2="110" stroke="#111827" stroke-width="3" />
    <line x1="520" y1="0" x2="520" y2="110" stroke="#111827" stroke-width="3" />
    <line x1="560" y1="0" x2="560" y2="110" stroke="#111827" stroke-width="3" />
    <!-- Crne dirke -->
    <rect x="25" y="0" width="28" height="65" rx="4" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <rect x="65" y="0" width="28" height="65" rx="4" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <rect x="145" y="0" width="28" height="65" rx="4" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <rect x="185" y="0" width="28" height="65" rx="4" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <rect x="225" y="0" width="28" height="65" rx="4" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <rect x="305" y="0" width="28" height="65" rx="4" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <rect x="345" y="0" width="28" height="65" rx="4" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <rect x="425" y="0" width="28" height="65" rx="4" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <rect x="465" y="0" width="28" height="65" rx="4" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <rect x="505" y="0" width="28" height="65" rx="4" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
  </g>

  <!-- BUBNJEVI (gore desno) -->
  <g transform="translate(540, 220)">
    <ellipse cx="90" cy="40" rx="90" ry="30" fill="#ffffff" stroke="#111827" stroke-width="5" />
    <path d="M 0 40 L 0 140 Q 90 180 180 140 L 180 40 Z" fill="#ffffff" stroke="#111827" stroke-width="5" />
    <line x1="20" y1="50" x2="35" y2="150" stroke="#111827" stroke-width="3" />
    <line x1="60" y1="65" x2="80" y2="160" stroke="#111827" stroke-width="3" />
    <line x1="120" y1="65" x2="105" y2="160" stroke="#111827" stroke-width="3" />
    <line x1="160" y1="50" x2="145" y2="150" stroke="#111827" stroke-width="3" />
    <!-- Palice za bubanj -->
    <line x1="-30" y1="-20" x2="70" y2="35" stroke="#111827" stroke-width="5" stroke-linecap="round" />
    <circle cx="75" cy="38" r="8" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <line x1="210" y1="-20" x2="110" y2="35" stroke="#111827" stroke-width="5" stroke-linecap="round" />
    <circle cx="105" cy="38" r="8" fill="#ffffff" stroke="#111827" stroke-width="3" />
  </g>

  <!-- VIOLINSKI KLJUČ I NOTE -->
  <!-- Violinski ključ (levo gore) -->
  <g transform="translate(80, 80) scale(1.4)">
    <path d="M 40 140 C 40 180, 15 180, 15 155 C 15 130, 45 130, 45 100 C 45 60, 25 30, 35 0 C 40 -10, 50 -10, 42 15 C 30 50, 60 80, 60 110 C 60 145, 30 160, 30 180 C 30 195, 45 195, 45 185" fill="none" stroke="#111827" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="45" cy="188" r="5" fill="#111827" />
  </g>

  <!-- Note -->
  <!-- Nota 1 (dvojna) -->
  <g transform="translate(360, 80)">
    <ellipse cx="20" cy="60" rx="16" ry="12" transform="rotate(-20 20 60)" fill="#111827" />
    <ellipse cx="80" cy="50" rx="16" ry="12" transform="rotate(-20 80 50)" fill="#111827" />
    <line x1="33" y1="56" x2="33" y2="10" stroke="#111827" stroke-width="4.5" />
    <line x1="93" y1="46" x2="93" y2="0" stroke="#111827" stroke-width="4.5" />
    <polygon points="30,10 95,0 95,12 30,22" fill="#111827" />
  </g>
  <!-- Nota 2 -->
  <g transform="translate(480, 420)">
    <ellipse cx="20" cy="40" rx="16" ry="12" transform="rotate(-20 20 40)" fill="#111827" />
    <line x1="33" y1="36" x2="33" y2="-10" stroke="#111827" stroke-width="4.5" />
    <path d="M 33 -10 Q 55 -5 50 15" fill="none" stroke="#111827" stroke-width="4.5" stroke-linecap="round" />
  </g>
  <!-- Zvezdice / iskre melodije -->
  <polygon points="260,180 265,195 280,195 268,205 272,220 260,210 248,220 252,205 240,195 255,195" fill="#ffffff" stroke="#111827" stroke-width="2.5" />
  <polygon points="680,100 684,112 696,112 686,120 690,132 680,124 670,132 674,120 664,112 676,112" fill="#ffffff" stroke="#111827" stroke-width="2.5" />
</svg>
