<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#ffffff" />

  <!-- Cirkuske zastavice i girlande na vrhu -->
  <path d="M 40 80 Q 200 130 400 90 Q 600 130 760 80" fill="none" stroke="#111827" stroke-width="3.5" />
  <polygon points="80,92 120,98 100,140" fill="#ffffff" stroke="#111827" stroke-width="3" />
  <polygon points="160,105 200,108 180,150" fill="#ffffff" stroke="#111827" stroke-width="3" />
  <polygon points="240,108 280,106 260,150" fill="#ffffff" stroke="#111827" stroke-width="3" />
  <polygon points="320,101 360,95 340,140" fill="#ffffff" stroke="#111827" stroke-width="3" />
  <polygon points="440,95 480,101 460,140" fill="#ffffff" stroke="#111827" stroke-width="3" />
  <polygon points="520,106 560,108 540,150" fill="#ffffff" stroke="#111827" stroke-width="3" />
  <polygon points="600,108 640,105 620,150" fill="#ffffff" stroke="#111827" stroke-width="3" />
  <polygon points="680,98 720,92 700,140" fill="#ffffff" stroke="#111827" stroke-width="3" />

  <!-- CIRKUSKA ŠATRA U POZADINI -->
  <g transform="translate(180, 120)">
    <!-- Krov šatre sa prugama -->
    <polygon points="220,40 40,220 400,220" fill="#ffffff" stroke="#111827" stroke-width="4.5" stroke-linejoin="round" />
    <path d="M 220 40 L 130 220 M 220 40 L 220 220 M 220 40 L 310 220" fill="none" stroke="#111827" stroke-width="3.5" />
    <!-- Zastavica na vrhu -->
    <line x1="220" y1="40" x2="220" y2="10" stroke="#111827" stroke-width="4" />
    <polygon points="220,10 270,25 220,40" fill="#ffffff" stroke="#111827" stroke-width="3.5" stroke-linejoin="round" />
    <!-- Zid šatre i ulaz -->
    <rect x="60" y="220" width="320" height="90" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <path d="M 170 310 Q 220 230 270 310 Z" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <line x1="120" y1="220" x2="120" y2="310" stroke="#111827" stroke-width="2.5" stroke-dasharray="8 6" />
    <line x1="320" y1="220" x2="320" y2="310" stroke="#111827" stroke-width="2.5" stroke-dasharray="8 6" />
  </g>

  <!-- Podijum / Cirkuska arena linija tla -->
  <ellipse cx="400" cy="720" rx="360" ry="60" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
  <path d="M 60 710 Q 400 780 740 710" fill="none" stroke="#111827" stroke-width="3" stroke-dasharray="10 8" />

  <!-- SLONČIĆ KOJI BALANSIRA NA LOPTI (LEVO) -->
  <g transform="translate(130, 360)">
    <!-- Lopta sa prugama -->
    <circle cx="110" cy="300" r="65" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
    <path d="M 50 300 Q 110 240 170 300 Q 110 360 50 300 Z" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <line x1="110" y1="235" x2="110" y2="365" stroke="#111827" stroke-width="3.5" />
    <!-- Telo slončeta -->
    <ellipse cx="110" cy="160" rx="65" ry="50" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
    <!-- Noge koje stoje na lopti -->
    <rect x="75" y="195" width="28" height="45" rx="10" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <rect x="115" y="195" width="28" height="45" rx="10" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <!-- Glava -->
    <circle cx="60" cy="120" r="40" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
    <!-- Veliko uvo -->
    <path d="M 75 90 C 120 70 120 160 80 150 Z" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <!-- Oko -->
    <circle cx="50" cy="115" r="5" fill="#111827" />
    <!-- Surla podignuta uvis -->
    <path d="M 40 135 Q 0 140 10 90 Q 20 60 45 70" fill="none" stroke="#111827" stroke-width="7" stroke-linecap="round" />
    <!-- Mali repić -->
    <path d="M 175 160 Q 195 180 185 200" fill="none" stroke="#111827" stroke-width="3.5" stroke-linecap="round" />
    <!-- Mala cirkuska kapica na glavi -->
    <polygon points="60,80 48,50 72,50" fill="#ffffff" stroke="#111827" stroke-width="3" stroke-linejoin="round" />
    <circle cx="60" cy="46" r="5" fill="#111827" />
  </g>

  <!-- MAĐIONIČARSKI ŠEŠIR SA ZEČIĆEM (CENTAR) -->
  <g transform="translate(330, 430)">
    <!-- Zečić koji viri -->
    <ellipse cx="70" cy="80" rx="35" ry="30" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <!-- Uši zečića -->
    <ellipse cx="50" cy="25" rx="10" ry="32" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <ellipse cx="50" cy="25" rx="5" ry="20" fill="none" stroke="#111827" stroke-width="2" />
    <ellipse cx="88" cy="25" rx="10" ry="32" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <ellipse cx="88" cy="25" rx="5" ry="20" fill="none" stroke="#111827" stroke-width="2" />
    <!-- Oči, njuškica, brčići -->
    <circle cx="58" cy="75" r="4" fill="#111827" />
    <circle cx="82" cy="75" r="4" fill="#111827" />
    <polygon points="70,82 66,88 74,88" fill="#111827" />
    <line x1="55" y1="86" x2="35" y2="84" stroke="#111827" stroke-width="2" />
    <line x1="55" y1="89" x2="35" y2="93" stroke="#111827" stroke-width="2" />
    <line x1="85" y1="86" x2="105" y2="84" stroke="#111827" stroke-width="2" />
    <line x1="85" y1="89" x2="105" y2="93" stroke="#111827" stroke-width="2" />
    <!-- Šapice zečića koje drže obod šešira -->
    <ellipse cx="40" cy="98" rx="10" ry="7" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <ellipse cx="100" cy="98" rx="10" ry="7" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <!-- Šešir cilindar -->
    <polygon points="20,100 120,100 110,210 30,210" fill="#ffffff" stroke="#111827" stroke-width="4.5" stroke-linejoin="round" />
    <!-- Obod šešira -->
    <ellipse cx="70" cy="100" rx="75" ry="16" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
    <!-- Traka na šeširu sa zvezdom -->
    <rect x="25" y="165" width="90" height="24" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <polygon points="70,167 73,174 81,174 75,179 77,186 70,182 63,186 65,179 59,174 67,174" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <!-- Mađioničarski štapić sa zvezdom -->
    <line x1="140" y1="80" x2="190" y2="180" stroke="#111827" stroke-width="5" stroke-linecap="round" />
    <rect x="135" y="70" width="12" height="20" rx="3" transform="rotate(-30 140 80)" fill="#111827" />
    <polygon points="140,55 144,65 155,65 146,72 149,82 140,76 131,82 134,72 125,65 136,65" fill="#ffffff" stroke="#111827" stroke-width="2.5" />
  </g>

  <!-- VESELI KLOVN SA BALONIMA (DESNO) -->
  <g transform="translate(560, 320)">
    <!-- Baloni koje drži -->
    <ellipse cx="40" cy="20" rx="28" ry="34" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <ellipse cx="90" cy="-10" rx="26" ry="32" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <ellipse cx="120" cy="35" rx="25" ry="30" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <path d="M 40 54 Q 70 120 80 180 M 90 22 Q 80 100 80 180 M 120 65 Q 100 120 80 180" fill="none" stroke="#111827" stroke-width="2" />
    <!-- Glava klovna -->
    <circle cx="70" cy="170" r="38" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <!-- Kosa klovna (kovrdže) -->
    <circle cx="32" cy="160" r="14" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <circle cx="30" cy="180" r="14" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <circle cx="108" cy="160" r="14" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <circle cx="110" cy="180" r="14" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <!-- Šiljata kapa -->
    <polygon points="70,132 50,75 90,75" fill="#ffffff" stroke="#111827" stroke-width="3.5" stroke-linejoin="round" />
    <circle cx="70" cy="70" r="8" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <!-- Lice: nos loptica, nasmejana usta, oči -->
    <circle cx="70" cy="175" r="10" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <circle cx="58" cy="162" r="4" fill="#111827" />
    <circle cx="82" cy="162" r="4" fill="#111827" />
    <path d="M 50 188 Q 70 205 90 188" fill="none" stroke="#111827" stroke-width="3.5" stroke-linecap="round" />
    <!-- Ogrlica / Kragna klovna -->
    <path d="M 40 208 Q 70 230 100 208 Q 110 225 90 230 Q 70 240 50 230 Z" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <!-- Telo / Odelo sa tufnama -->
    <ellipse cx="70" cy="275" rx="42" ry="50" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <circle cx="70" cy="255" r="7" fill="#ffffff" stroke="#111827" stroke-width="2.5" />
    <circle cx="70" cy="285" r="7" fill="#ffffff" stroke="#111827" stroke-width="2.5" />
    <!-- Široke pantalone i cipele -->
    <line x1="50" y1="320" x2="45" y2="390" stroke="#111827" stroke-width="6" stroke-linecap="round" />
    <line x1="90" y1="320" x2="95" y2="390" stroke="#111827" stroke-width="6" stroke-linecap="round" />
    <ellipse cx="35" cy="395" rx="22" ry="12" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <ellipse cx="105" cy="395" rx="22" ry="12" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
  </g>

  <!-- Zvezdice i konfete u vazduhu -->
  <polygon points="120,240 123,248 132,248 125,253 128,261 120,256 112,261 115,253 108,248 117,248" fill="#ffffff" stroke="#111827" stroke-width="2" />
  <polygon points="480,240 483,248 492,248 485,253 488,261 480,256 472,261 475,253 468,248 477,248" fill="#ffffff" stroke="#111827" stroke-width="2" />
  <polygon points="680,260 683,268 692,268 685,273 688,281 680,276 672,281 675,273 668,268 677,268" fill="#ffffff" stroke="#111827" stroke-width="2" />
  <circle cx="300" cy="290" r="4" fill="#111827" />
  <circle cx="510" cy="380" r="5" fill="#111827" />
  <circle cx="280" cy="400" r="4.5" fill="#111827" />
</svg>