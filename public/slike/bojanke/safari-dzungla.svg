  <!-- Krošnja akacije -->
  <ellipse cx="140" cy="250" rx="110" ry="35" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
  <ellipse cx="230" cy="220" rx="90" ry="30" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
  <ellipse cx="60" cy="270" rx="70" ry="25" fill="#ffffff" stroke="#111827" stroke-width="4.5" />

  <!-- Majmunče koje visi sa grane -->
  <g transform="translate(180, 250)">
    <!-- Rep -->
    <path d="M 20 0 Q 20 80 -10 90 Q -30 90 -20 60" fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round" />
    <!-- Telo -->
    <ellipse cx="-15" cy="130" rx="25" ry="35" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <!-- Glava -->
    <circle cx="-15" cy="180" r="22" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <circle cx="-35" cy="180" r="9" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <circle cx="5" cy="180" r="9" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <circle cx="-20" cy="178" r="3.5" fill="#111827" />
    <circle cx="-10" cy="178" r="3.5" fill="#111827" />
    <path d="M -18 188 Q -15 195 -12 188" fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- ŽIRAFA (centar desno) -->
  <g transform="translate(260, 180)">
    <!-- Noge -->
    <line x1="80" y1="360" x2="80" y2="520" stroke="#111827" stroke-width="6" stroke-linecap="round" />
    <line x1="110" y1="360" x2="110" y2="520" stroke="#111827" stroke-width="6" stroke-linecap="round" />
    <line x1="180" y1="360" x2="180" y2="520" stroke="#111827" stroke-width="6" stroke-linecap="round" />
    <line x1="210" y1="360" x2="210" y2="520" stroke="#111827" stroke-width="6" stroke-linecap="round" />
    <!-- Kopita -->
    <rect x="74" y="510" width="12" height="12" rx="3" fill="#111827" />
    <rect x="104" y="510" width="12" height="12" rx="3" fill="#111827" />
    <rect x="174" y="510" width="12" height="12" rx="3" fill="#111827" />
    <rect x="204" y="510" width="12" height="12" rx="3" fill="#111827" />
    <!-- Telo -->
    <ellipse cx="145" cy="350" rx="80" ry="50" fill="#ffffff" stroke="#111827" stroke-width="5" />
    <!-- Rep -->
    <path d="M 220 350 Q 250 390 240 440" fill="none" stroke="#111827" stroke-width="4.5" />
    <ellipse cx="238" cy="445" rx="8" ry="14" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <!-- Dug vrat -->
    <path d="M 85 340 L 50 80 L 95 80 L 125 340 Z" fill="#ffffff" stroke="#111827" stroke-width="5" stroke-linejoin="round" />
    <!-- Griva na vratu -->
    <path d="M 95 90 L 108 98 L 98 115 L 112 125 L 102 145 L 116 155 L 106 175 L 120 185 L 110 205 L 124 215 L 114 235 L 128 245 L 118 265" fill="none" stroke="#111827" stroke-width="4" />
    <!-- Glava žirafe -->
    <ellipse cx="65" cy="65" rx="35" ry="25" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
    <ellipse cx="45" cy="72" rx="16" ry="14" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <!-- Rogići -->
    <line x1="70" y1="42" x2="68" y2="20" stroke="#111827" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="68" cy="18" r="6" fill="#111827" />
    <line x1="85" y1="45" x2="88" y2="22" stroke="#111827" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="88" cy="20" r="6" fill="#111827" />
    <!-- Uvo -->
    <ellipse cx="98" cy="55" rx="14" ry="7" transform="rotate(-25 98 55)" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <!-- Oko -->
    <circle cx="65" cy="58" r="5" fill="#111827" />
    <circle cx="67" cy="56" r="1.5" fill="#ffffff" />
    <!-- Nozdrva i osmeh -->
    <circle cx="40" cy="70" r="3" fill="#111827" />
    <path d="M 38 78 Q 45 84 52 78" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" />
    <!-- Pege po telu -->
    <rect x="75" y="140" width="22" height="26" rx="8" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <rect x="80" y="210" width="25" height="30" rx="9" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <rect x="90" y="280" width="28" height="26" rx="9" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <rect x="130" y="325" width="30" height="24" rx="8" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <rect x="175" y="340" width="26" height="28" rx="8" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
    <rect x="125" y="365" width="28" height="22" rx="7" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
  </g>

  <!-- MALI LAVIĆ (dole levo) -->
  <g transform="translate(100, 480)">
    <!-- Griva -->
    <circle cx="80" cy="90" r="65" fill="#ffffff" stroke="#111827" stroke-width="5" />
    <!-- Zupci grive -->
    <path d="M 80 15 Q 100 25 115 15 Q 130 30 145 25 Q 155 45 168 50 Q 170 70 180 80 Q 175 100 180 115 Q 168 130 168 145 Q 150 155 145 168 Q 130 170 115 180 Q 100 172 80 180 Q 65 170 50 175 Q 35 158 25 160 Q 20 140 10 130 Q 18 115 12 100 Q 10 80 18 68 Q 25 50 35 42 Q 50 30 65 32 Z" fill="#ffffff" stroke="#111827" stroke-width="4" stroke-linejoin="round" />
    <!-- Glava -->
    <circle cx="80" cy="95" r="48" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
    <!-- Uši -->
    <circle cx="45" cy="55" r="14" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <circle cx="115" cy="55" r="14" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <!-- Oči -->
    <circle cx="65" cy="88" r="6" fill="#111827" />
    <circle cx="95" cy="88" r="6" fill="#111827" />
    <!-- Njuškica i brkovi -->
    <polygon points="80,102 72,112 88,112" fill="#111827" />
    <path d="M 80 112 L 80 122 M 72 122 Q 80 128 88 122" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" />
    <line x1="55" y1="115" x2="35" y2="112" stroke="#111827" stroke-width="2.5" />
    <line x1="55" y1="122" x2="35" y2="124" stroke="#111827" stroke-width="2.5" />
    <line x1="105" y1="115" x2="125" y2="112" stroke="#111827" stroke-width="2.5" />
    <line x1="105" y1="122" x2="125" y2="124" stroke="#111827" stroke-width="2.5" />
    <!-- Telo lavića -->
    <path d="M 45 145 C 30 180 30 240 70 250 C 130 255 150 210 145 150 Z" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
    <!-- Prednje šape -->
    <ellipse cx="60" cy="245" rx="16" ry="12" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <ellipse cx="105" cy="245" rx="16" ry="12" fill="#ffffff" stroke="#111827" stroke-width="4" />
    <!-- Repić sa čupkom -->
    <path d="M 145 210 Q 185 200 175 160" fill="none" stroke="#111827" stroke-width="4.5" />
    <ellipse cx="175" cy="155" rx="12" ry="16" fill="#ffffff" stroke="#111827" stroke-width="3.5" />
  </g>

  <!-- Busenovi trave -->
  <g stroke="#111827" stroke-width="3.5" stroke-linecap="round">
    <path d="M 30 630 L 25 600 M 30 630 L 35 595 M 30 630 L 45 605" />
    <path d="M 520 640 L 510 610 M 520 640 L 525 605 M 520 640 L 535 615" />
    <path d="M 720 620 L 715 590 M 720 620 L 728 585 M 720 620 L 735 595" />
  </g>
</svg>
