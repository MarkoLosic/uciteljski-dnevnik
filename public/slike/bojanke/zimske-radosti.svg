<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#ffffff" />
  
  <!-- Zimska brda i sneg -->
  <path d="M 0 520 Q 220 460 450 510 T 800 500 L 800 800 L 0 800 Z" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
  <path d="M 0 620 Q 300 580 580 630 T 800 610 L 800 800 L 0 800 Z" fill="#ffffff" stroke="#111827" stroke-width="4.5" />

  <!-- Sneško Belić -->
  <!-- Donja lopta -->
  <circle cx="280" cy="560" r="110" fill="#ffffff" stroke="#111827" stroke-width="5" />
  <!-- Srednja lopta -->
  <circle cx="280" cy="400" r="80" fill="#ffffff" stroke="#111827" stroke-width="5" />
  <!-- Glava -->
  <circle cx="280" cy="270" r="60" fill="#ffffff" stroke="#111827" stroke-width="5" />

  <!-- Dugmad od uglja -->
  <circle cx="280" cy="370" r="9" fill="#111827" />
  <circle cx="280" cy="410" r="9" fill="#111827" />
  <circle cx="280" cy="450" r="9" fill="#111827" />

  <!-- Oči i osmeh -->
  <circle cx="260" cy="255" r="7" fill="#111827" />
  <circle cx="300" cy="255" r="7" fill="#111827" />
  <!-- Šargarepa nos -->
  <polygon points="280,265 345,275 280,285" fill="#ffffff" stroke="#111827" stroke-width="4" stroke-linejoin="round" />
  <line x1="295" y1="270" x2="295" y2="280" stroke="#111827" stroke-width="3" />
  <line x1="315" y1="272" x2="315" y2="278" stroke="#111827" stroke-width="3" />
  <!-- Osmeh od kamenčića -->
  <circle cx="255" cy="295" r="5" fill="#111827" />
  <circle cx="270" cy="305" r="5" fill="#111827" />
  <circle cx="290" cy="305" r="5" fill="#111827" />
  <circle cx="305" cy="295" r="5" fill="#111827" />

  <!-- Šal -->
  <path d="M 230 320 Q 280 335 330 320 Q 335 340 325 350 Q 280 360 235 345 Z" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
  <path d="M 300 340 L 325 430 L 295 435 L 280 345 Z" fill="#ffffff" stroke="#111827" stroke-width="4" stroke-linejoin="round" />
  <line x1="295" y1="435" x2="297" y2="445" stroke="#111827" stroke-width="3" />
  <line x1="305" y1="433" x2="307" y2="445" stroke="#111827" stroke-width="3" />
  <line x1="315" y1="432" x2="317" y2="445" stroke="#111827" stroke-width="3" />

  <!-- Šešir / Lonac -->
  <rect x="235" y="200" width="90" height="15" rx="5" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
  <polygon points="245,200 315,200 305,140 255,140" fill="#ffffff" stroke="#111827" stroke-width="4.5" stroke-linejoin="round" />
  <path d="M 255 140 Q 280 135 305 140" fill="none" stroke="#111827" stroke-width="4" />

  <!-- Ruke od grančica -->
  <path d="M 205 380 L 120 340 M 150 355 L 140 330 M 135 348 L 120 365" fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round" />
  <path d="M 355 380 L 440 340 M 410 355 L 420 330 M 425 348 L 440 365" fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round" />

  <!-- Sanke desno -->
  <g transform="translate(480, 500)">
    <!-- Skije sanke -->
    <path d="M 30 140 L 240 140 Q 280 140 270 90 Q 260 70 235 80" fill="none" stroke="#111827" stroke-width="5.5" stroke-linecap="round" />
    <path d="M 0 160 L 210 160 Q 250 160 240 110" fill="none" stroke="#111827" stroke-width="5.5" stroke-linecap="round" />
    <!-- Stubovi -->
    <line x1="60" y1="140" x2="60" y2="90" stroke="#111827" stroke-width="5" stroke-linecap="round" />
    <line x1="140" y1="140" x2="140" y2="90" stroke="#111827" stroke-width="5" stroke-linecap="round" />
    <line x1="210" y1="140" x2="210" y2="90" stroke="#111827" stroke-width="5" stroke-linecap="round" />
    <!-- Daska za sedenje -->
    <rect x="40" y="80" width="190" height="15" rx="6" fill="#ffffff" stroke="#111827" stroke-width="4.5" />
    <!-- Kanap -->
    <path d="M 235 80 Q 270 50 250 10 Q 230 -20 200 10" fill="none" stroke="#111827" stroke-width="4" stroke-dasharray="8 6" />
  </g>

  <!-- Jelke u pozadini -->
  <!-- Leva jelka -->
  <g transform="translate(60, 240)">
    <polygon points="70,0 110,60 90,60 130,120 105,120 145,190 0,190 35,120 10,120 50,60 30,60" fill="#ffffff" stroke="#111827" stroke-width="4.5" stroke-linejoin="round" />
    <rect x="55" y="190" width="30" height="40" fill="#ffffff" stroke="#111827" stroke-width="4" />
  </g>
  <!-- Desna jelka -->
  <g transform="translate(640, 260)">
    <polygon points="60,0 95,50 80,50 110,100 90,100 120,160 0,160 30,100 10,100 40,50 25,50" fill="#ffffff" stroke="#111827" stroke-width="4.5" stroke-linejoin="round" />
    <rect x="45" y="160" width="25" height="35" fill="#ffffff" stroke="#111827" stroke-width="4" />
  </g>

  <!-- Pahuljice snega -->
  <g stroke="#111827" stroke-width="3.5" stroke-linecap="round">
    <!-- Pahulja 1 -->
    <g transform="translate(180, 100)">
      <line x1="-18" y1="0" x2="18" y2="0" /><line x1="0" y1="-18" x2="0" y2="18" />
      <line x1="-12" y1="-12" x2="12" y2="12" /><line x1="-12" y1="12" x2="12" y2="-12" />
    </g>
    <!-- Pahulja 2 -->
    <g transform="translate(420, 80)">
      <line x1="-22" y1="0" x2="22" y2="0" /><line x1="0" y1="-22" x2="0" y2="22" />
      <line x1="-15" y1="-15" x2="15" y2="15" /><line x1="-15" y1="15" x2="15" y2="-15" />
    </g>
    <!-- Pahulja 3 -->
    <g transform="translate(600, 120)">
      <line x1="-16" y1="0" x2="16" y2="0" /><line x1="0" y1="-16" x2="0" y2="16" />
      <line x1="-11" y1="-11" x2="11" y2="11" /><line x1="-11" y1="11" x2="11" y2="-11" />
    </g>
    <!-- Pahulja 4 -->
    <g transform="translate(480, 240)">
      <line x1="-14" y1="0" x2="14" y2="0" /><line x1="0" y1="-14" x2="0" y2="14" />
    </g>
    <!-- Pahulja 5 -->
    <g transform="translate(110, 480)">
      <line x1="-14" y1="0" x2="14" y2="0" /><line x1="0" y1="-14" x2="0" y2="14" />
    </g>
    <!-- Male tačke snega -->
    <circle cx="120" cy="180" r="4" fill="#111827" />
    <circle cx="220" cy="160" r="4" fill="#111827" />
    <circle cx="350" cy="120" r="5" fill="#111827" />
    <circle cx="520" cy="160" r="5" fill="#111827" />
    <circle cx="680" cy="200" r="4" fill="#111827" />
    <circle cx="430" cy="460" r="4" fill="#111827" />
    <circle cx="730" cy="480" r="4" fill="#111827" />
  </g>
</svg>
